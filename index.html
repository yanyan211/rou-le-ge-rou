<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>肉了个肉</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one fixed 360×720 game stage, scaled to fit the screen, on a soft green gingham picnic cloth. Single deliberate light look in a green family. */
:root{
  --cloth:#eef5e7;
  --stripe:rgba(84,150,88,.13);
  --accent:#3c8c55;
  --wood:#79b277;
  --wood-dark:#21402f;
  --tile:#fbfdf6;
  --tile-edge:#a9d097;
  --shade:#8ea392;
  --ink:#1f3529;
  --mustard:#cfe9a9;
  --cat:#7cc47f;
  --cat-light:#d4efc0;
  --blush:#f3a9a0;
  --danger:#d9663f;
  --veil:rgba(22,44,31,.55);
  --ad-bg:rgba(15,29,21,.84);
  --ad-ink:#eaf5e4;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;box-sizing:border-box;overflow:hidden;
  background-color:var(--cloth);
  background-image:repeating-linear-gradient(0deg,var(--stripe) 0 18px,transparent 18px 36px),
                   repeating-linear-gradient(90deg,var(--stripe) 0 18px,transparent 18px 36px);
  color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#wrap{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:360px;height:720px;transform-origin:0 0}

.title{position:absolute;left:14px;top:10px;font-family:var(--display);font-size:32px;line-height:1;color:var(--accent);
  text-shadow:2px 0 var(--tile),-2px 0 var(--tile),0 2px var(--tile),0 -2px var(--tile),0 4px 0 var(--wood-dark)}
.issue{position:absolute;right:14px;top:8px;text-align:right;font-size:12px;line-height:1.35;color:var(--wood-dark)}
.issue b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--accent)}
.issue b.n{font-size:15px}
.bar{position:absolute;left:14px;right:14px;top:54px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.bar .lv{white-space:nowrap;font-family:var(--display);font-size:16px;background:var(--wood-dark);color:var(--tile);padding:2px 10px;border-radius:999px}
.bar .left{font-variant-numeric:tabular-nums;color:var(--wood-dark)}
.sound{background:none;border:1.5px solid var(--wood-dark);color:var(--wood-dark);border-radius:999px;font:12px var(--body);padding:1px 8px;cursor:pointer}

.tile{position:absolute;left:0;top:0;width:45px;height:47px;cursor:pointer;will-change:transform;
  transition:transform .2s cubic-bezier(.25,.8,.35,1)}
.tile .face{position:absolute;inset:0;box-sizing:border-box;border-radius:9px;
  background:var(--tile);border:1.5px solid var(--wood-dark);
  box-shadow:0 4px 0 var(--tile-edge),0 5px 0 1.5px var(--wood-dark);
  display:grid;place-items:center;transition:background-color .15s}
.tile .e{font-size:28px;line-height:1;pointer-events:none;transition:opacity .15s,filter .15s}
.tile img.e{position:absolute;inset:0;width:100%;height:100%;border-radius:7.5px;object-fit:cover;display:block}
.tile.blocked{cursor:default}
.tile.blocked .face{background:var(--shade)}
.tile.blocked .e{opacity:.42;filter:grayscale(.7)}
.tile.blocked img.e{opacity:1;filter:brightness(.4) grayscale(.6)}
.tile.pop{pointer-events:none}
.tile.pop .face{animation:pop .34s ease-in forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.2);filter:brightness(1.15)}55%{transform:scale(1.12)}100%{transform:scale(0);opacity:0}}
.tile.wiggle .face{animation:wig .4s ease}
@keyframes wig{30%{transform:rotate(-12deg) scale(.9)}70%{transform:rotate(10deg) scale(1.05)}}

.slotbox{position:absolute;left:12px;top:596px;width:336px;height:64px;box-sizing:border-box;border-radius:12px;
  background:var(--wood);border:3px solid var(--wood-dark);
  background-image:repeating-linear-gradient(90deg,transparent 0 45px,rgba(33,64,47,.3) 45px 46px);
  background-position:4px 0;box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.slotbox.danger{border-color:var(--danger)}
.holdhint{position:absolute;left:108px;top:538px;width:144px;height:52px;border:2px dashed rgba(33,64,47,.3);border-radius:10px;
  display:grid;place-items:center;font-size:12px;color:rgba(33,64,47,.55)}

.props{position:absolute;left:12px;right:12px;top:672px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prop{position:relative;height:40px;border-radius:12px;border:2.5px solid var(--wood-dark);background:var(--mustard);
  font-family:var(--display);font-size:18px;color:var(--wood-dark);cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.prop:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
.prop:disabled{background:var(--shade);color:var(--tile);cursor:default;box-shadow:0 3px 0 var(--wood-dark)}
.prop i{position:absolute;top:-8px;right:-6px;font-style:normal;font:11px var(--body);background:var(--accent);color:var(--tile);
  border-radius:999px;padding:1px 6px;border:1.5px solid var(--tile)}
.prop:disabled i{display:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.toast{position:absolute;left:50%;top:300px;transform:translate(-50%,0);background:var(--wood-dark);color:var(--tile);
  padding:8px 16px;border-radius:999px;font-size:14px;z-index:9000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.veil{position:fixed;inset:0;background:var(--veil);z-index:8000;display:grid;place-items:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.veil .card{transform:scale(var(--s,1))}
.veil .card.show{animation:popin .34s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{from{transform:scale(calc(var(--s,1)*.6));opacity:0}to{transform:scale(var(--s,1));opacity:1}}
.card{width:290px;box-sizing:border-box;background:var(--tile);border:3px solid var(--wood-dark);border-radius:18px;
  box-shadow:0 6px 0 var(--wood-dark);padding:22px 20px 20px;text-align:center}
.card h2{margin:0 0 8px;font:400 34px/1.1 var(--display);color:var(--accent);text-wrap:balance}
.card p{margin:0 0 6px;font-size:14px;line-height:1.6;color:var(--ink)}
.card .meta{font-size:12px;color:var(--wood);font-variant-numeric:tabular-nums}
.card .btns{display:grid;gap:10px;margin-top:16px}
.btn{height:44px;border-radius:12px;border:2.5px solid var(--wood-dark);background:var(--tile);font:400 19px var(--display);
  color:var(--wood-dark);cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.btn.primary{background:var(--accent);color:var(--tile)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
.big-emoji{font-size:46px;line-height:1;margin-bottom:6px}
.cat{display:block;margin:0 auto 8px;width:84px;height:auto}
.bar>span{display:flex;align-items:center;gap:6px}
.pausebtn{width:24px;height:24px;padding:0;border:1.5px solid var(--wood-dark);border-radius:50%;background:var(--tile);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:3px;box-sizing:border-box}
.pausebtn i{display:block;width:3px;height:10px;border-radius:1px;background:var(--wood-dark)}
.pausebtn:active{transform:translateY(1px)}
.bar .left b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--accent)}
.card .count{display:inline-block;margin:2px 0 8px;padding:3px 12px;border-radius:999px;background:var(--cat-light);color:var(--wood-dark);font-size:13px}
.card .count b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--accent)}

.ad{position:fixed;inset:0;z-index:9500;background:var(--ad-bg);color:var(--ad-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;animation:fade .2s ease;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.ad-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center}
.ad-tag{font-size:12px;border:1px solid var(--ad-ink);border-radius:4px;padding:1px 6px;opacity:.7}
.ad-close{font:14px var(--body);color:var(--ad-ink);background:rgba(234,245,228,.14);border:1px solid rgba(234,245,228,.35);border-radius:999px;padding:6px 14px;cursor:pointer;font-variant-numeric:tabular-nums}
.ad-close:disabled{cursor:default;opacity:.85}
.ad-body{display:grid;place-items:center;width:100%;min-height:0;flex:1}
.ad-body video{max-width:100%;max-height:100%;border-radius:12px;background:#000}
.ad-body .disc{width:min(72vw,340px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid rgba(234,245,228,.18);box-shadow:0 0 0 2px rgba(234,245,228,.08),0 18px 50px rgba(0,0,0,.5);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ad-title{margin:0;font:400 20px var(--display);text-align:center}
.ad-link{display:block;border-radius:50%;-webkit-tap-highlight-color:transparent}
.ad-link:focus-visible{outline:3px solid var(--ad-ink);outline-offset:6px}
.ad-hint{margin:-8px 0 0;font-size:13px;opacity:.75;text-align:center}
.ad-hint a{color:var(--ad-ink);text-decoration:underline;text-underline-offset:3px;margin-left:8px}
.ad-err{font-size:14px;opacity:.75}
@media (prefers-reduced-motion:reduce){.ad-body .disc{animation-duration:40s}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.wiggle .face,.veil,.veil .card.show{animation:none}.tile.pop .face{animation-duration:.01s}}
/* 主页横幅：跑马灯（绿底白字，仅主页显示） */
.topbanner{position:fixed;left:0;right:0;top:0;z-index:8500;overflow:hidden;white-space:nowrap;pointer-events:none;
  background:#3a9459;color:#fff;border-bottom:2px solid #fff;text-shadow:0 1px 0 rgba(0,0,0,.18);
  font-family:var(--display);font-size:15px;line-height:1;padding:9px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.topbanner .tb-track{display:inline-flex;width:max-content;animation:roumarquee 28s linear infinite;will-change:transform}
.topbanner .tb-track span{padding-right:28px}
@keyframes roumarquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(-33.3333%,0,0)}}
@media (prefers-reduced-motion:reduce){.topbanner .tb-track{animation-duration:40s}}
</style>

</div></div>

<div class="veil" id="veil" hidden><div class="card" id="card"></div></div>

  <div class="ad-body" id="adBody"></div>
  <p class="ad-title" id="adTitle"></p>
  <p class="ad-hint" id="adHint" hidden></p>
</div>

// ---------- 随机数（按日期种子，保证同一天所有人关卡一样） ----------
function seedOf(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function rngFrom(s){let a=seedOf(s);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function pad(n){return String(n).padStart(2,'0')}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function issueNo(key){const [y,m,d]=key.split('-').map(Number),[y0,m0,d0]=CONFIG.firstIssueDate.split('-').map(Number);

function untilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-n)/1000));

function overlaps(a,b){return Math.abs(a.x-b.x)<TW&&Math.abs(a.y-b.y)<FH}
function genLayout(cfg,rng){
  const t=[];const [gx0,gx1]=cfg.gx,[gy0,gy1]=cfg.gy,mid=(gx0+gx1)/2;
  const add=(gx,gy,z)=>t.push({x:BX+gx*TW/2,y:BY+gy*FH/2,z,zone:'board'});
  for(let z=0;z<cfg.maxLayers&&t.length<cfg.board;z++){
    const ox=rng()<.5?0:1,oy=rng()<.5?0:1,d=cfg.density[0]+rng()*(cfg.density[1]-cfg.density[0]);
    for(let gy=gy0+oy;gy<=gy1;gy+=2)for(let gx=gx0+ox;gx<=mid;gx+=2){
      if(rng()<d){add(gx,gy,z);const m=gx0+gx1-gx;if(m!==gx)add(m,gy,z)}
    }
  }
  while(t.length>cfg.board){const top=Math.max(...t.map(o=>o.z));const c=t.filter(o=>o.z===top);t.splice(t.indexOf(c[Math.floor(rng()*c.length)]),1)}
  for(let i=0;i<cfg.stack;i++){
    t.push({x:18+i*4,y:476,z:i,zone:'stack'});
    t.push({x:360-18-TW-i*4,y:476,z:i,zone:'stack'});
  }
  return t;
}
// 倒推分配图案：每次从"当前可点"的牌里取 3 张配成一组，保证一定有解
function assignTypes(t,typeIds,rng,cap){
  if(t.length%3)return false;
  // 1. 随机生成一条合法的拿牌顺序
  const left=new Set(t),seq=[];
  while(left.size){
    const free=[...left].filter(a=>{for(const b of left)if(b!==a&&b.z>a.z&&overlaps(a,b))return false;return true});
    const pick=free[Math.floor(rng()*free.length)];seq.push(pick);left.delete(pick);
  }
  seq.forEach((o,i)=>o.seq=i);
  if(!cap){ // 热身：每连续 3 张同一图案
    const bag=shuffle(Array.from({length:t.length/3},(_,k)=>typeIds[k%typeIds.length]),rng);
    seq.forEach((o,i)=>o.type=bag[Math.floor(i/3)]);return true;
  }
  // 2. 地狱：按这条顺序拿牌时，槽位要一直压到 cap 张附近才能过
  const quota=new Map();typeIds.forEach(ty=>quota.set(ty,0));
  for(let k=0;k<t.length/3;k++)quota.set(typeIds[k%typeIds.length],quota.get(typeIds[k%typeIds.length])+1);
  const pend=new Map();let occ=0;
  for(let i=0;i<seq.length;i++){
    const rem=seq.length-i-1;let need=0,has2=false;
    for(const c of pend.values()){need+=3-c;if(c===2)has2=true}
    const moves=[];
    const openable=[...quota].filter(([ty,q])=>q>0&&!pend.has(ty)).map(x=>x[0]);
    if(openable.length&&occ+1<=cap&&need+2<=rem&&(occ+1<cap||has2))moves.push({w:occ<cap-2?5:1.2,ty:shuffle(openable,rng)[0],open:true});
    for(const [ty,c] of pend){
      if(c===1&&occ+1<=cap)moves.push({w:2,ty});
      if(c===2)moves.push({w:occ>=cap-1?4:.5,ty});
    }
    if(!moves.length)return false;
    let r=rng()*moves.reduce((a,m)=>a+m.w,0),m=moves[0];
    for(const x of moves){if((r-=x.w)<=0){m=x;break}}
    seq[i].type=m.ty;
    if(m.open){quota.set(m.ty,quota.get(m.ty)-1);pend.set(m.ty,1);occ++}
    else if(pend.get(m.ty)===1){pend.set(m.ty,2);occ++}
    else{pend.delete(m.ty);occ-=2}
  }
  return pend.size===0;
}

function decodeLevel(code){
  const t=[];
  for(let k=0;k<code.length;k+=4){const c=code.slice(k,k+4);
    if(c[0]==='l'||c[0]==='r'){const i=parseInt(c[1],36),type=parseInt(c[2],16);
      t.push({zone:'stack',z:i,x:c[0]==='l'?18+i*4:360-18-TW-i*4,y:476,type})}
    else{const gx=parseInt(c[0],16),gy=parseInt(c[1],16),z=parseInt(c[2],16),type=parseInt(c[3],16);
      t.push({zone:'board',z,x:BX+gx*TW/2,y:BY+gy*FH/2,type})}}
  return t;
}
function dailyIndex(){return Math.max(0,issueNo(todayKey())-1)}
function dailyLevel(){
  const k=dailyIndex(),t=decodeLevel(POOL[k%POOL.length]);
  // 关卡池循环使用时，按日期重新映射图案，牌局结构与难度不变
  const cycle=Math.floor(k/POOL.length);
  if(cycle>0){const perm=shuffle([...Array(16).keys()],rngFrom('cycle'+cycle+'-'+k));t.forEach(o=>o.type=perm[o.type])}
  return t;
}
function buildLevel(li){
  if(li===1)return dailyLevel();
  const cfg=LEVELS[li],seed=li===0?'warmup':'daily-'+todayKey();
  const types=shuffle([...CONFIG.tiles.keys()],rngFrom(seed+'-types')).slice(0,cfg.types);
  for(let a=0;a<60;a++){
    const rng=rngFrom(seed+'#'+a),t=genLayout(cfg,rng);
    if(t.length%3)continue;
    if(assignTypes(t,types,rng,cfg.cap))return t;
  }
  throw new Error('关卡生成失败');
}

// ---------- 今日通关人数（Cloudflare D1） ----------
let clearCount=null;
function uid(){try{let u=localStorage.getItem('rou-uid');if(!u){u=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('rou-uid',u)}return u}catch(e){return 'anon-'+Math.random().toString(36).slice(2)}}
function clearsText(){return clearCount==null?'--':String(clearCount)}
function paintClears(){document.querySelectorAll('[data-clears]').forEach(el=>el.textContent=clearsText())}
// 依次尝试各个接口地址，记住第一个能用的
let apiBase=null;
function apiList(){const v=CONFIG.statsApi;if(v==null)return [];const l=Array.isArray(v)?v:[v];return apiBase!=null?[apiBase,...l.filter(x=>x!==apiBase)]:l}
async function api(path,init){
  for(const base of apiList()){
    try{const r=await fetch(base+path,init);if(!r.ok)continue;const j=await r.json();if(j&&typeof j.cleared==='number'){apiBase=base;return j}}catch(e){}
  }
  return null;
}
async function refreshClears(){
  const j=await api(`/api/stats?day=${todayKey()}`);
  if(j)clearCount=j.cleared;paintClears();
}
// 通关后上报；返回"你是今天第几位通关的"（同一台设备一天只算一次）
async function reportClear(){
  const j=await api('/api/clear',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({day:todayKey(),uid:uid()})});
  if(!j)return null;clearCount=j.cleared;paintClears();return j.rank??null;
}
// 每 5 分钟刷新一次人数；页面在后台时不刷新，切回来时补刷

// ---------- 看广告复活 ----------
// 广告清单放在 ads/ads.json，格式见 ads/说明.txt
let ADS=[];
const IN_WECHAT=/MicroMessenger/i.test(navigator.userAgent);
fetch('ads/ads.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(j=>{ADS=(Array.isArray(j)?j:(j.ads||[])).filter(a=>a&&a.src)}).catch(()=>{});
function playAd(onDone){
  const ad=ADS[Math.floor(Math.random()*ADS.length)];
  const body=$('adBody');body.innerHTML='';
  const isVideo=ad.type==='video'||/\.(mp4|webm|mov)(\?|$)/i.test(ad.src);
  let media;
  if(isVideo){media=document.createElement('video');media.setAttribute('playsinline','');media.playsInline=true;body.appendChild(media)}
  else{const img=document.createElement('img');img.className='disc';img.alt='';img.src=ad.cover||ICON;
    if(ad.link){const a=document.createElement('a');a.className='ad-link';a.href=ad.link;a.target='_blank';a.rel='noopener';
      // 有 app 链接、且不在微信里：点封面直接唤起 QQ 音乐 App（微信内置浏览器会拦截唤起其他 App）
      if(ad.app&&!IN_WECHAT)a.onclick=e=>{e.preventDefault();openAppOrWeb(ad.app,ad.link)};a.setAttribute('aria-label','打开歌曲链接');a.appendChild(img);body.appendChild(a)}
    else body.appendChild(img);media=document.createElement('audio');media.hidden=true;body.appendChild(media)}
  media.src=ad.src;media.loop=true;media.preload='auto';
  media.onerror=()=>{const e=document.createElement('p');e.className='ad-err';e.textContent='广告加载失败，倒计时结束后仍可复活';body.appendChild(e)};
  $('adTitle').textContent=ad.title||'';
  const hint=$('adHint');hint.hidden=!(ad.link&&!isVideo);hint.textContent='';
  if(ad.link&&!isVideo){
    if(ad.app&&!IN_WECHAT){hint.append('点击封面在 QQ 音乐 App 中打开');const w=document.createElement('a');w.href=ad.link;w.target='_blank';w.rel='noopener';w.textContent='没有 App？打开网页版';hint.append(w)}
    else hint.append(IN_WECHAT&&ad.app?'点击封面收听完整版（想直接打开 App，请点右上角「…」选择在浏览器打开）':'点击封面收听完整版');
  }
  $('ad').hidden=false;
  media.play().catch(()=>{});   // 在点击事件里直接播放，手机浏览器才允许带声音播放
  let left=CONFIG.adSeconds;const btn=$('adClose');btn.disabled=true;btn.textContent=`${left} 秒后可关闭`;
  const timer=setInterval(()=>{
    if(document.hidden)return;                       // 切到后台不计时
    if(media.paused&&!media.error)media.play().catch(()=>{});
    left--;
    if(left>0)btn.textContent=`${left} 秒后可关闭`;
    else{clearInterval(timer);btn.disabled=false;btn.textContent='关闭 ✕'}
  },1000);
  btn.onclick=()=>{
    if(left>0)return;
    media.pause();media.removeAttribute('src');try{media.load()}catch(e){}
    body.innerHTML='';$('ad').hidden=true;onDone();
  };
}
// 点封面：新开一个中转页（open.html）去唤起 App，没装 App 时中转页会自动改开网页版；游戏页保持不动
function openAppOrWeb(app,web){
  const w=window.open('open.html?app='+encodeURIComponent(app)+'&web='+encodeURIComponent(web),'_blank');
  if(!w)window.open(web,'_blank');
}
function adRevive(){
  closeOverlay();
  playAd(()=>{
    G.adRevived=(G.adRevived||0)+1;G.over=false;moveOut();
    overlay(`<img class="cat" src="${ICON}" alt=""><h2>复活成功</h2><p>已把 3 张牌移出槽位，继续加油！</p>`,[{label:'继续游戏',primary:true,onClick:closeOverlay}]);
  });
}
$('pause').innerHTML='<i></i><i></i>';

// ---------- 音效 ----------
let soundOn=true,actx=null;
function beep(freqs,dur=.09,type='triangle',vol=.08){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*.06;
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.02)})}catch(e){}
}

// ---------- 游戏状态 ----------
let G=null;
function faceHTML(type){const v=CONFIG.tiles[type];return '<div class="face">'+(/^(data:|https?:|\.?\/)/.test(v)?`<img class="e" src="${v}" alt="">`:`<span class="e">${v}</span>`)+'</div>'}

function startLevel(li){
  closeOverlay();
  $('topbanner').hidden=true;
  if(li===1){today().tries++;saveStore(store)}
  const host=$('tiles');host.innerHTML='';
  const tiles=buildLevel(li).map((o,i)=>({...o,id:i,state:'field'}));
  tiles.forEach(t=>{
    const el=document.createElement('div');el.className='tile';el.innerHTML=faceHTML(t.type);el.style.transform=`translate3d(${t.x}px,${t.y}px,0)`;
    el.addEventListener('click',()=>onTile(t));t.el=el;host.appendChild(el);
  });
  G={li,tiles,slot:[],history:[],props:{out:1,undo:1,shuffle:1},revived:false,busy:false,over:false,hold:0,total:tiles.length};
  $('lv').textContent=LEVELS[li].name;
  render();
}

function isFree(t){
  if(t.state!=='field')return false;
  if(t.zone==='hold')return true;   // 移出区的牌互相不遮挡，露出的部分都能点
  for(const o of G.tiles)if(o!==t&&o.state==='field'&&o.z>t.z&&overlaps(o,t))return false;
  return true;
}
// 移出区：所有牌排成一排居中；超过 3 张时微微交错叠放（后移出的压在上面），每张都露出大部分
function layoutHold(){
  const h=G.tiles.filter(t=>t.state==='field'&&t.zone==='hold').sort((a,b)=>a.holdOrder-b.holdOrder);
  if(!h.length)return;
  const n=h.length,step=n<=3?TW:Math.min(38,(316-TW)/(n-1)),w=TW+step*(n-1),x0=Math.round(180-w/2);
  h.forEach((t,i)=>{t.x=Math.round(x0+i*step);t.y=540;t.z=i});
}
function render(){
  layoutHold();
  for(const t of G.tiles){
    if(t.state==='gone')continue;
    const s=t.el.style;
    if(t.state==='field'){s.transform=`translate3d(${t.x}px,${t.y}px,0)`;s.zIndex=(t.zone==='hold'?600:10)+t.z;t.el.classList.toggle('blocked',!isFree(t))}
  }
  G.slot.forEach((t,i)=>{const s=t.el.style;s.transform=`translate3d(${SLOT_X+i*TW}px,${SLOT_Y}px,0)`;s.zIndex=3000+i;t.el.classList.remove('blocked')});
  const left=G.tiles.filter(t=>t.state!=='gone').length;
  $('slotbox').classList.toggle('danger',G.slot.length>=CONFIG.slotSize-1);
  $('holdhint').hidden=G.tiles.some(t=>t.zone==='hold'&&t.state==='field');
  [['pOut','out'],['pUndo','undo'],['pShuffle','shuffle']].forEach(([id,k])=>$(id).disabled=!G.props[k]);
}

function onTile(t){
  if(!G||G.busy||G.over||!isFree(t))return;
  if(G.slot.length>=CONFIG.slotSize)return;
  G.history.push({t,x:t.x,y:t.y,z:t.z,zone:t.zone});
  t.state='slot';
  let idx=-1;G.slot.forEach((o,i)=>{if(o.type===t.type)idx=i});
  if(idx>=0)G.slot.splice(idx+1,0,t);else G.slot.push(t);
  beep([520],.06);
  render();
  const same=G.slot.filter(o=>o.type===t.type);
  if(same.length>=3){
    G.busy=true;
    setTimeout(()=>{
      same.slice(0,3).forEach(o=>{o.state='gone';o.el.classList.add('pop');setTimeout(()=>o.el.remove(),380)});
      G.slot=G.slot.filter(o=>o.state==='slot');
      beep([660,880,1100],.12,'sine',.07);
      G.busy=false;render();
      if(G.tiles.every(o=>o.state==='gone'))setTimeout(win,300);
    },200);
  }else if(G.slot.length>=CONFIG.slotSize){
    G.over=true;setTimeout(lose,380);
  }
}

function moveOut(){
  const take=G.slot.slice(0,3);
  take.forEach((t,i)=>{t.state='field';t.zone='hold';t.holdOrder=G.hold*10+i});
  G.hold++;G.slot=G.slot.slice(take.length);
  render();
}
$('pOut').onclick=()=>{
  if(!G||G.busy||G.over)return;
  if(!G.slot.length)return toast('槽位里还没有牌');
  G.props.out=0;moveOut();beep([400,300],.08);
};
$('pUndo').onclick=()=>{
  if(!G||G.busy||G.over)return;
  const h=G.history[G.history.length-1];
  if(!h||h.t.state!=='slot')return toast('上一步已经消除，撤回不了');
  G.history.pop();const t=h.t;
  Object.assign(t,{x:h.x,y:h.y,z:h.z,zone:h.zone,state:'field'});
  G.slot=G.slot.filter(o=>o!==t);G.props.undo=0;beep([300,450],.08);render();
};
$('pShuffle').onclick=()=>{
  if(!G||G.busy||G.over)return;
  const field=G.tiles.filter(t=>t.state==='field'&&t.zone!=='hold'); // 只洗牌主牌区和两摞，移出区的牌保持不变
  const types=shuffle(field.map(t=>t.type),Math.random);
  field.forEach((t,i)=>{t.type=types[i];t.el.innerHTML=faceHTML(t.type);t.el.classList.remove('wiggle');void t.el.offsetWidth;t.el.classList.add('wiggle')});
  G.props.shuffle=0;beep([350,500,350],.07);render();
};
function showPause(){
  const challenge=G.li===1;
  overlay(`<img class="cat" src="${ICON}" alt=""><h2>已暂停</h2><p>${LEVELS[G.li].name}</p>${challenge?`<p class="meta">重新开始会计入挑战次数（今日已挑战 ${today().tries} 次）</p>`:''}`,
    [{label:'继续游戏',primary:true,onClick:closeOverlay},
     {label:CONFIG.restartText,onClick:()=>confirmDiscard(()=>startLevel(G.li))},
     {label:'回到首页',onClick:()=>confirmDiscard(home)}]);
}
// 重新开始 / 回到首页前确认；取消则回到暂停界面
function confirmDiscard(go){
  overlay(`<img class="cat" src="${ICON}" alt=""><h2 style="font-size:23px">确认丢弃当前进度吗？</h2><p>当前这一局的进度不会保存。</p>`,
    [{label:'确认',primary:true,onClick:go},{label:'取消',onClick:showPause}]);
}
$('pause').onclick=()=>{if(!G||G.over||!$('veil').hidden)return;showPause()};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='音效 '+(soundOn?'开':'关')};

// ---------- 弹窗 ----------
let tickTimer=null;
function overlay(html,buttons){
  const card=$('card');card.innerHTML=html+'<div class="btns"></div>';
  const box=card.querySelector('.btns');
  buttons.forEach(b=>{const el=document.createElement('button');el.type='button';el.className='btn'+(b.primary?' primary':'');el.textContent=b.label;el.onclick=b.onClick;box.appendChild(el)});
  $('veil').hidden=false;
  card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
  clearInterval(tickTimer);
  const cd=card.querySelector('[data-countdown]');
  if(cd)tickTimer=setInterval(()=>{cd.textContent=untilMidnight();if(todayKey()!==shownDay)location.reload()},1000);
}
function closeOverlay(){$('veil').hidden=true;clearInterval(tickTimer)}
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1500)}

function lose(){
  beep([300,220,160],.18,'sawtooth',.05);
  const btns=[];
  // 「移出」道具和复活效果相同，只给一个按钮：先消耗移出道具，用过了再用复活机会
  if(G.props.out||!G.revived)btns.push({label:'复活（移出 3 张继续）',primary:true,onClick:()=>{if(G.props.out)G.props.out=0;else G.revived=true;G.over=false;closeOverlay();moveOut()}});
  const canAd=!(G.props.out||!G.revived)&&ADS.length&&(G.adRevived||0)<CONFIG.adRevives;
  if(canAd)btns.push({label:'看广告复活',primary:true,onClick:adRevive});
  btns.push({label:CONFIG.restartText+'本关',primary:!(G.props.out||!G.revived)&&!canAd,onClick:()=>startLevel(G.li)});
  if(G.li===1)btns.push({label:'回到首页',onClick:home});
  const left=G.tiles.filter(t=>t.state!=='gone').length;
  overlay(`<div class="big-emoji">🔥</div><h2>烤糊了</h2><p>槽位满了，还剩 ${left} 张牌。</p>${G.li===1?`<p class="meta">今日已挑战 ${today().tries} 次</p>`:''}`,btns);
}
function win(){
  beep([523,659,784,1046],.18,'sine',.08);
  if(G.li===0){
    overlay(`<div class="big-emoji">🍖</div><h2>热身完成</h2><p>第二关：<br>自酿们准备迎接地狱难度吧<br>( ̀⌄ ́)</p>`,
      [{label:'挑战今日关卡',primary:true,onClick:()=>startLevel(1)}]);
  }else{
    const d=today();const first=!d.cleared;d.cleared=true;saveStore(store);
    reportClear().then(rank=>{const el=document.querySelector('[data-rank]');if(el&&rank)el.textContent=`你是今天第 ${rank} 位通关的娘娘！`});
    const total=Object.values(store.days).filter(x=>x.cleared).length;
    overlay(`<div class="big-emoji">🏆</div><h2>今日通关</h2><p>第 ${issueNo(shownDay)} 期，用了 ${d.tries} 次${first?'':'（已经通关过啦）'}。</p><p data-rank></p><div class="count">今日已通关 <b data-clears>${clearsText()}</b> 位娘娘</div><p class="meta">累计通关 ${total} 天 · 下一期 <span data-countdown>${untilMidnight()}</span></p>`,
      [{label:'再玩一次今日关卡',primary:true,onClick:()=>startLevel(1)},{label:'回到首页',onClick:home}]);
  }
}
let shownDay=todayKey();
function home(){
  $('topbanner').hidden=false;
  const d=today();
  $('issue').innerHTML=`<b>第 ${issueNo(shownDay)} 期</b> · ${Number(shownDay.slice(5,7))}月${Number(shownDay.slice(8))}日<br>今日已通关 <b class="n" data-clears>${clearsText()}</b> 位娘娘`;
  overlay(`<img class="cat" src="${ICON}" alt=""><h2>${CONFIG.title}</h2>
    <p>点击上层的牌放入下方槽位，满三张相同时自动消除，槽位最多七张，达到七张无法消除时失败。</p>
    <p>第1关热身，第2关地狱难度每日更新，大家加油吧ദ്ദി◝ ⩊ ◜.ᐟ</p>
    <div class="count">今日已通关 <b data-clears>${clearsText()}</b> 位娘娘</div>
    <p class="meta">${d.cleared?'今日已通关 ✓ · ':''}今日挑战 ${d.tries} 次 · 下一期 <span data-countdown>${untilMidnight()}</span></p>`,
    [{label:CONFIG.startText,primary:true,onClick:()=>startLevel(0)},{label:'跳过热身，直接挑战',onClick:()=>startLevel(1)}]);
  refreshClears();
}

// ---------- 自适应缩放 ----------
function fit(){
  const b=document.body,cs=getComputedStyle(b);
  const w=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const s=Math.max(.3,Math.min(w/360,h/720,1.6));
  $('wrap').style.width=360*s+'px';$('wrap').style.height=720*s+'px';
  $('stage').style.transform=`scale(${s})`;
  document.documentElement.style.setProperty('--s',s);
}
addEventListener('resize',fit);
$('title').textContent=CONFIG.title;
fit();
startLevel(0);   // 先把热身关摆在背后，首页弹窗盖在上面
home();
</script>
</body></html>
