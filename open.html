<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正在打开 QQ 音乐</title>
<style>
:root{--bg:#eef5e7;--ink:#1f3529;--accent:#3c8c55;--line:#21402f;color-scheme:light}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;text-align:center}
.box{display:grid;gap:14px;max-width:320px}
h1{margin:0;font-size:20px}
p{margin:0;opacity:.75}
a{display:block;padding:12px;border-radius:12px;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
a.primary{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="box">
  <h1 id="t">正在打开 QQ 音乐…</h1>
  <p id="d">如果没有自动跳转，可以点下面的按钮</p>
  <a class="primary" id="app" href="#">打开 QQ 音乐 App</a>
  <a id="web" href="#">打开网页版</a>
</div>
<script>
// 中转页：先尝试唤起 App；1.2 秒后仍停在这一页（说明没装 App）就改去网页版。
// 从 App 回来时自动关闭本页，回到游戏。
(function(){
  var q=new URLSearchParams(location.search);
  var app=q.get('app')||'',web=q.get('web')||'';
  // 只允许 QQ 音乐的 App 链接和 https 网页，防止被拿来跳到别的地方
  if(!/^qqmusic:\/\//i.test(app))app='';
  if(!/^https:\/\//i.test(web))web='';
  document.getElementById('app').href=app||'#';
  document.getElementById('web').href=web||'#';
  if(!app&&web){location.replace(web);return}
  var left=false;
  function mark(){left=true}
  window.addEventListener('pagehide',mark);window.addEventListener('blur',mark);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){left=true}
    else if(left){ // 从 App 回来了
      document.getElementById('t').textContent='已在 QQ 音乐中打开';
      document.getElementById('d').textContent='可以关闭此页，回到游戏';
      try{window.close()}catch(e){}
    }
  });
  if(app)location.href=app;
  setTimeout(function(){if(!left&&!document.hidden&&web)location.replace(web)},1200);
})();
</script>
</body>
</html>
